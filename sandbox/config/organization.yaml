# OpenHIS sandbox department rebuild configuration.
#
# Only leaf departments are listed here. Parent grouping nodes from the source
# taxonomy, such as 内科/外科/妇产科/儿科, are intentionally not injected.

hospital:
  # If empty, the first OpenHIS organization with typeEnum=1 is used.
  name: ""

department_defaults:
  type_enum: 2
  class_enum: 1
  yb_no_prefix: "SIM-DEPT"
  display_order_start: 10
  display_order_step: 10

